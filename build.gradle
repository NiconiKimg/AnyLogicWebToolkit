plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.anylogic.webtoolkit'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'me.friwi:jcefmaven:146.0.10'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.windowTitle = "AnyLogic Web Toolkit ${version} API"
    options.header = "AnyLogic Web Toolkit ${version}"
}

tasks.register('patchAnyLogicLibrary', Copy) {
    from zipTree('AnyLogicLibrary/WebToolkit.jar')
    into "${layout.buildDirectory.get().asFile}/anylogic_unpacked"
    
    doLast {
        def libXml = file("${layout.buildDirectory.get().asFile}/anylogic_unpacked/library.xml")
        if (libXml.exists()) {
            def parser = new groovy.xml.XmlParser(false, false)
            def root = parser.parse(libXml)
            
            // Remove ClassPathEntry nodes referencing .jar files
            def toRemove = root.'**'.ClassPathEntry.findAll { entry ->
                entry.ResourceReference?.ClassName?.text()?.contains(".jar")
            }
            toRemove.each { it.parent().remove(it) }
            
            // Remove Resource nodes referencing .jar files
            def toRemoveRes = root.'**'.Resource.findAll { res ->
                res.Path?.text()?.contains(".jar")
            }
            toRemoveRes.each { it.parent().remove(it) }
            
            libXml.text = groovy.xml.XmlUtil.serialize(root)
        }
    }
}

shadowJar {
    dependsOn patchAnyLogicLibrary
    archiveBaseName.set('AnyLogicWebToolkit')
    archiveClassifier.set('')
    archiveVersion.set('0.1.0')
    
    // Merge the modified AnyLogic exported library into our fat jar!
    from "${layout.buildDirectory.get().asFile}/anylogic_unpacked"
    
    relocate 'com.google.gson', 'com.anylogic.webtoolkit.shaded.gson'
    mergeServiceFiles()
    destinationDirectory.set(file("${projectDir}/dist"))
}

tasks.register('copyExamples', Copy) {
    from 'examples'
    into "${projectDir}/dist/examples"
}

tasks.register('buildDist') {
    group = 'build'
    description = 'Builds the distribution JAR in dist/'
    dependsOn shadowJar
    doLast {
        copy {
            from "${projectDir}/dist/AnyLogicWebToolkit-0.1.0.jar"
            into "${projectDir}/AnyLogicLibrary"
        }
        println 'AnyLogicWebToolkit-0.1.0.jar copied to AnyLogicLibrary/'
    }
}